<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperTrail email</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #f2f3f7;
        --surface: #ffffff;
        --text: #172033;
        --muted: #515a70;
        --accent: #7764d8;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0f;
          --surface: #18181d;
          --text: #f2f2f5;
          --muted: #a3a3ae;
          --accent: #b7a9ff;
          --on-accent: #29165f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        font-size: 24px;
        line-height: 1.25;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
      }
      .button {
        display: block;
        padding: 14px 20px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        text-decoration: none;
      }
      .hint {
        margin: 16px 0 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Your email is verified</h1>
      <p id="message">Open PaperTrail to finish signing in.</p>
      <a id="open" class="button" href="papertrail://auth/callback">Open PaperTrail</a>
      <p class="hint" id="hint">
        Reading this on a computer? Open PaperTrail on your phone and log in
        with your email and password.
      </p>
    </main>
    <script>
      // Supabase sends people here after they click the link in an email. The
      // sign-in tokens are in the URL fragment, which never reaches this web
      // server; the button hands them to the app, which finishes signing in.
      var search = window.location.search;
      var hash = window.location.hash;
      var appUrl = "papertrail://auth/callback" + search + hash;
      var failed = /error/.test(search + hash);

      if (failed) {
        var params = new URLSearchParams((search + "&" + hash.slice(1)).replace(/^\?/, ""));
        document.getElementById("title").textContent = "This link didn't work";
        document.getElementById("message").textContent =
          (params.get("error_description") || "The link may have expired or already been used.") +
          " Open PaperTrail and request a new email.";
        document.getElementById("open").setAttribute("href", "papertrail://");
        document.getElementById("hint").remove();
      } else {
        document.getElementById("open").setAttribute("href", appUrl);
      }
    </script>
  </body>
</html>
